<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora | Explore Idaho</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/flora.js" defer></script>
    <script src="scripts/loadHeaderFooter.js" defer></script>
</head>
<body>
    <header></header>

<!-- change flora-body to child-page-body -->
    <main class="flora-body">
        <h1 class="child-page-title">Flora</h1>
        <section class="info">

            <form>
                <input type="text" id="search-bar" placeholder="Search">
                <button type="submit" id="search-button">
                    <img src="styles/images/search.svg" alt="search icon">
                </button>
            </form>
        <div id="tag-filters">
            <select aria-label="region" id="region-select">
                <option value="">Choose a region:</option>
                <option value="south">South</option>
                <option value="central">Central</option>
                <option value="north">North</option>
            </select>
            <select aria-label="flora type" id="type-select">
                <option value="">Choose a flora type:</option>
                <option value="trees">Trees</option>
                <option value="shrubs">Shrubs</option>
                <option value="grasses">Grasses</option>
                <option value="wildflowers">Wildflowers</option>
                <!-- <option value="cacti">Cacti</option>
                <option value="weeds">Invasive Weeds</option> -->
            </select>
        </div>
        <button type="button" id="clear-button">Clear</button>
 
        <div id="flora-container"></div>

            </div>
        </section>
    </main>    
    <footer></footer>
</body>
</html>
